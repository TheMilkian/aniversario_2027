<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniversário do Michel</title>

    <link rel="stylesheet" href="styles/main.scss">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>

<body>

    <div class="card" data-aos="flip-down" data-aos-duration="1000">
    <div class="emoji">🥳🎉🎂🎉🥳</div>
    <h1>Aniversário do Michel</h1>
    <h2>Uma noite especial cheia de alegria!</h2>

    <p>
      Você está convidado para celebrar esse momento incrível
      com muito carinho, diversão e boas energias.
    </p>

    <div class="info"  data-aos="flip-left" data-aos-easing="ease-out-cubic" data-aos-duration="2500">
      <p class="info__text">
                A festa começa em: <span id="contador"></span>
            </p>
      <p>📅 <strong>08/01/2027</strong></p>
      <p>🕗 <strong>20h00</strong></p>
      <p>📍 <strong>Espaço Quintal</strong></p>
    </div>

    <a href="#" class="btn" data-aos="flip-right" data-aos-easing="ease-out-cubic" data-aos-duration="2000">Confirmar Presença</a>

    <footer>
      Esperamos você nessa festa inesquecível! ✨
    </footer>
  </div>
<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script src="scripts/main.js"></script>
</body>
</html>
